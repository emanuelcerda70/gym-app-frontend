<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym App AI - Entrenador Personal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    
    <header class="app-header">
      <div class="brand-logo">
        <span>GYM APP</span>
        <span class="brand-badge">AI COACH</span>
      </div>
    </header>

    <nav class="navigation-bar">
      <button class="nav-tab active" onclick="cambiarPestana('chat')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Chatbot</span>
      </button>
      <button class="nav-tab" onclick="cambiarPestana('biblioteca')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Biblioteca</span>
      </button>
      <button class="nav-tab" onclick="cambiarPestana('rutina')">
        <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        <span>Mi Rutina</span>
      </button>
    </nav>

    <section id="view-chat" class="view-section active">
      <div class="chat-wrapper">
        <div class="chat-history" id="chatHistory">
          <div class="chat-message bot">
            <div class="avatar-bot">AI</div>
            <div class="message-content">
              ¡Hola, Ema! Soy tu coach de entrenamiento y nutrición. ¿En qué enfocamos el entrenamiento de hoy?
            </div>
          </div>
        </div>

        <div class="quick-chips-container">
          <button class="chip-button" onclick="enviarMensajeChip('Armame una rutina de tren superior de hipertrofia')">💪 Tren Superior</button>
          <button class="chip-button" onclick="enviarMensajeChip('Armame una rutina de piernas e isquios')">🦵 Tren Inferior</button>
          <button class="chip-button" onclick="enviarMensajeChip('¿Qué puedo comer post entreno económico en el Alto Valle?')">🥗 Dieta Económica</button>
        </div>

        <!-- ZONA DE INPUT CON CÁMARA (NUEVA FASE 3) -->
        <div class="chat-input-box" style="position: relative; display: flex; align-items: center; gap: 8px;">
          
          <div id="imagePreviewContainer" style="display: none; position: absolute; top: -65px; left: 10px; background: var(--bg-card); padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <img id="imagePreview" src="" style="height: 50px; border-radius: 4px; object-fit: cover;">
            <button onclick="quitarImagen()" style="position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 12px; font-weight: bold;">X</button>
          </div>

          <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previsualizarImagen(event)">
          <button onclick="document.getElementById('imageInput').click()" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; filter: grayscale(100%); opacity: 0.7; transition: 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">
            📷
          </button>

          <input type="text" id="chatInput" class="chat-input-field" placeholder="Escribile a tu coach..." onkeypress="detectarEnter(event)">
          <button class="send-btn" onclick="enviarMensaje()">➤</button>
        </div>
      </div>
    </section>

    <section id="view-biblioteca" class="view-section">
      <h2 class="section-title">Biblioteca de Ejercicios</h2>
      <div class="exercise-grid" id="bibliotecaGrid">
        <div class="exercise-card">
          <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dW5-C1fsMjk" allowfullscreen></iframe>
          </div>
          <div class="exercise-body">
            <div class="exercise-header">
              <span class="exercise-name">Back Squat</span>
              <span class="muscle-badge">Cuádriceps / Glúteos</span>
            </div>
            <p class="exercise-instruction">Sentate hacia atrás y abajo, rotá las puntas de los pies 15° hacia afuera y empujá las rodillas lateralmente.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- PESTAÑA 3: MI RUTINA (DINÁMICA) -->
    <section id="view-rutina" class="view-section">
      <h2 class="section-title" id="tituloMiRutina">Mi Rutina</h2>
      <p id="descMiRutina" style="color: var(--text-secondary); margin-bottom: 16px; font-size: 14px;"></p>
      <div class="exercise-grid" id="contenedorEjerciciosRutina">
      </div>
    </section>

  </div>

  <script>
    function cambiarPestana(pestana) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(`view-${pestana}`).classList.add('active');
      event.currentTarget.classList.add('active');

      if (pestana === 'rutina') cargarMiRutina();
    }

    async function cargarMiRutina() {
      const contenedor = document.getElementById('contenedorEjerciciosRutina');
      const titulo = document.getElementById('tituloMiRutina');
      const desc = document.getElementById('descMiRutina');
      
      contenedor.innerHTML = "<p style='text-align:center; padding: 20px;'>Cargando tu rutina desde la base de datos... ⏳</p>";
      
      try {
        const response = await fetch('https://gym-app-backend-n7we.onrender.com/api/rutinas/1');
        if (!response.ok) throw new Error("No hay rutinas");
        
        const data = await response.json();
        titulo.innerText = data.nombre_rutina;
        desc.innerText = data.descripcion;
        
        let htmlEjercicios = "";
        data.ejercicios.forEach(ej => {
          htmlEjercicios += `
            <div class="exercise-card">
              <div class="exercise-body">
                <div class="exercise-header">
                  <span class="exercise-name" style="font-size: 18px; text-transform: capitalize;">${ej.nombre}</span>
                  <span class="muscle-badge" style="background-color: var(--primary);">${ej.series} Series x ${ej.repeticiones}</span>
                </div>
                <p class="exercise-instruction">Descanso: ${ej.descanso} segundos</p>
                <div class="routine-controls">
                  <div class="weight-input-group">
                    <span class="exercise-instruction">Peso (kg):</span>
                    <input type="number" class="weight-input" placeholder="0">
                  </div>
                  <label class="exercise-instruction" style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                    Hecho <input type="checkbox" class="checkbox-custom">
                  </label>
                </div>
              </div>
            </div>
          `;
        });
        contenedor.innerHTML = htmlEjercicios;
      } catch (error) {
        titulo.innerText = "Mi Rutina";
        desc.innerText = "";
        contenedor.innerHTML = "<p style='text-align:center; padding: 20px;'>Todavía no tenés rutinas guardadas. ¡Pedile una a tu coach en el chat!</p>";
      }
    }

    function detectarEnter(e) {
      if (e.key === 'Enter') enviarMensaje();
    }

    function enviarMensajeChip(texto) {
      document.getElementById('chatInput').value = texto;
      enviarMensaje();
    }

    // --- LÓGICA DE VISIÓN Y MEMORIA ---
    let memoriaDelChat = [];
    let imagenBase64Actual = null;

    function previsualizarImagen(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        imagenBase64Actual = e.target.result; 
        document.getElementById('imagePreview').src = imagenBase64Actual;
        document.getElementById('imagePreviewContainer').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function quitarImagen() {
      imagenBase64Actual = null;
      document.getElementById('imageInput').value = '';
      document.getElementById('imagePreviewContainer').style.display = 'none';
    }

    async function enviarMensaje() {
      const input = document.getElementById('chatInput');
      const mensaje = input.value.trim();
      
      if (!mensaje && !imagenBase64Actual) return;

      const history = document.getElementById('chatHistory');

      let htmlUsuario = `<div class="chat-message user"><div class="message-content">`;
      if (imagenBase64Actual) {
        htmlUsuario += `<img src="${imagenBase64Actual}" style="max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: block;"><br>`;
      }
      htmlUsuario += `${mensaje}</div></div>`;
      history.innerHTML += htmlUsuario;
      
      input.value = '';
      const imagenAEnviar = imagenBase64Actual;
      quitarImagen(); 
      history.scrollTop = history.scrollHeight;

      const loadingId = 'loading-' + Date.now();
      history.innerHTML += `
        <div class="chat-message bot" id="${loadingId}">
          <div class="avatar-bot">AI</div>
          <div class="message-content">Consultando a la ciencia... ⏳</div>
        </div>
      `;
      history.scrollTop = history.scrollHeight;

      try {
        const response = await fetch('https://gym-app-backend-n7we.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario_id: 1, 
            pregunta: mensaje || "¿Qué ves en esta imagen?",
            historial: memoriaDelChat,
            imagen_base64: imagenAEnviar 
          })
        });

        const data = await response.json();
        
        memoriaDelChat.push({ role: "user", content: mensaje || "[Envió una imagen]" });
        memoriaDelChat.push({ role: "ai", content: data.respuesta || "Error" });
        
        const respuestaFormateada = data.respuesta ? data.respuesta.replace(/\n/g, '<br>') : "Tuvimos un problema al responder.";
        document.getElementById(loadingId).querySelector('.message-content').innerHTML = respuestaFormateada;
      } catch (error) {
        document.getElementById(loadingId).querySelector('.message-content').innerText = "Ocurrió un error al conectar con el servidor.";
      }
      
      history.scrollTop = history.scrollHeight;
    }
  </script>

</body>
</html>
